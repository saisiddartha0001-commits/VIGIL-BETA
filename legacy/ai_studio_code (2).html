    // --- REUSABLE BADGE COMPONENT ---
    function RiskBadge({ level, size = 'sm' }) {
      const sizeClasses = size === 'xs' ? 'px-1.5 py-0.5 text-[10px]' : 'px-2 py-0.5 text-xs';
      if (level === 'Critical') {
        return (
          <span className={`inline-flex items-center gap-1.5 font-mono font-semibold rounded border border-space-threat/40 bg-space-threat/10 text-space-threat ${sizeClasses}`}>
            <span className="w-1.5 h-1.5 rounded-full bg-space-threat animate-pulse" />
            CRITICAL
          </span>
        );
      }
      if (level === 'Elevated') {
        return (
          <span className={`inline-flex items-center gap-1.5 font-mono font-medium rounded border border-space-warning/40 bg-space-warning/10 text-space-warning ${sizeClasses}`}>
            <span className="w-1.5 h-1.5 rounded-full bg-space-warning" />
            ELEVATED
          </span>
        );
      }
      return (
        <span className={`inline-flex items-center gap-1.5 font-mono font-medium rounded border border-space-safe/30 bg-space-safe/10 text-space-safe ${sizeClasses}`}>
          <span className="w-1.5 h-1.5 rounded-full bg-space-safe" />
          NOMINAL
        </span>
      );
    }

    // --- CONFIRMATION DIALOG MODAL ---
    function ConfirmationModal({ isOpen, onClose, onConfirm, targetSatellite }) {
      if (!isOpen || !targetSatellite) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-space-base/80 backdrop-blur-sm">
          <div className="w-full max-w-md bg-space-card border border-space-threat/50 rounded-xl p-6 shadow-2xl relative overflow-hidden">

                <IconFlame />
              </div>
              <div>
                <h3 className="text-base font-semibold text-space-textPrimary">Confirm Simulated ΔV Maneuver</h3>
                <p className="text-xs text-space-textSecondary mt-0.5">Execution authorization for collision avoidance vector</p>
              </div>
            </div>

                <span className="text-space-cyan font-semibold">+2.40 m/s (Prograde)</span>
              </div>
              <div className="flex justify-between">

              </div>
            </div>

    // --- MAIN APPLICATION SHELL ---
    function App() {
      const [currentPage, setCurrentPage] = useState('overview'); // 'overview' | 'satellites' | 'alerts'
      const [satellites, setSatellites] = useState(INITIAL_SATELLITES);
      const [selectedSatelliteId, setSelectedSatelliteId] = useState('SAT-VYOM-01');
      const [systemTime, setSystemTime] = useState(() => new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC');
      const [toastMessage, setToastMessage] = useState(null);
      const [modalTargetSat, setModalTargetSat] = useState(null);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);

      // Search & Filters for Catalog
      const [catalogSearch, setCatalogSearch] = useState('');
      const [regimeFilter, setRegimeFilter] = useState('ALL');
      const [riskFilter, setRiskFilter] = useState('ALL');

      // Live UTC clock (cosmetic clock)
      useEffect(() => {
        const timer = setInterval(() => {
          setSystemTime(new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC');
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const selectedSatellite = useMemo(() => {
        return satellites.find(s => s.id === selectedSatelliteId) || satellites[0];
      }, [satellites, selectedSatelliteId]);

      // Dynamic statistics calculations
      const stats = useMemo(() => {
        const total = satellites.length;
        const operational = satellites.filter(s => s.status.toLowerCase().includes('operational')).length;
        const critical = satellites.filter(s => s.riskLevel === 'Critical').length;
        const elevated = satellites.filter(s => s.riskLevel === 'Elevated').length;

        const breakdown = {
          LEO: satellites.filter(s => s.regime === 'LEO').length,
          MEO: satellites.filter(s => s.regime === 'MEO').length,
          GEO: satellites.filter(s => s.regime === 'GEO').length
        };

        return { total, operational, critical, elevated, breakdown };
      }, [satellites]);

      // Request Burn (Opens Modal)
      const handleRequestBurn = (satId) => {
        const target = satellites.find(s => s.id === satId);
        if (target) {
          setModalTargetSat(target);
        }
      };

      // Confirm & Execute Burn
      const handleConfirmBurn = () => {
        if (!modalTargetSat) return;
        const targetId = modalTargetSat.id;

        setSatellites(prev => prev.map(sat => {
          if (sat.id === targetId) {
            return {
              ...sat,
              riskLevel: 'Nominal',
              color: '#35D39A',
              missDistance: 5380,
              poc: '< 1.0e-7',
              tca: 'RESOLVED (POST-BURN)',
              status: 'Operational [Simulated ΔV: +2.4 m/s]'
            };
          }
          return sat;
        }));

        setToastMessage({
          title: 'SIMULATED MANEUVER EXECUTED',
          body: `Illustrative ΔV burn applied to ${modalTargetSat.name}. Modeled miss distance increased to 5,380 m. Local state refreshed.`
        });
        setModalTargetSat(null);

        setTimeout(() => setToastMessage(null), 5000);
      };

      // Reset Simulation to default
      const handleResetSimulation = () => {
        setSatellites(INITIAL_SATELLITES);
        setSelectedSatelliteId('SAT-VYOM-01');
        setToastMessage({
          title: 'SIMULATION RESET COMPLETE',
          body: 'All orbital states, threat vectors, and conjunction scenarios restored to baseline parameters.'
        });
        setTimeout(() => setToastMessage(null), 4000);
      };

      // Filtered catalog list
      const filteredSatellites = useMemo(() => {
        return satellites.filter(sat => {
          const matchQuery = sat.name.toLowerCase().includes(catalogSearch.toLowerCase()) ||
                             sat.id.toLowerCase().includes(catalogSearch.toLowerCase()) ||
                             sat.operator.toLowerCase().includes(catalogSearch.toLowerCase());
          const matchRegime = regimeFilter === 'ALL' || sat.regime === regimeFilter;
          const matchRisk = riskFilter === 'ALL' || sat.riskLevel === riskFilter;
          return matchQuery && matchRegime && matchRisk;
        });
      }, [satellites, catalogSearch, regimeFilter, riskFilter]);

      // Active conjunction threat items
      const alertItems = useMemo(() => {
        return satellites.filter(s => s.riskLevel === 'Critical' || s.riskLevel === 'Elevated');
      }, [satellites]);

      const navItems = [
        { id: 'overview', label: 'Overview HUD', icon: IconDashboard, badge: null },
        { id: 'satellites', label: 'Orbital Catalog', icon: IconCatalog, badge: stats.total },
        { id: 'alerts', label: 'Conjunction Alerts', icon: IconAlertTriangle, badge: stats.critical + stats.elevated }
      ];

      return (
        <div className="flex flex-col md:flex-row min-h-screen bg-space-base text-space-textPrimary font-sans">
          
          {/* ================= LEFT SIDEBAR ================= */}
          <aside className="hidden md:flex w-[260px] flex-col justify-between shrink-0 bg-space-sidebar border-r border-space-border p-4 z-20">
            <div>
              {/* Brand Header */}
              <div className="pb-4 border-b border-space-border">
                <div className="flex items-center gap-3">
                  <div className="p-2 rounded-lg bg-space-card border border-space-border">
                    <IconLogoOrbit />
                  </div>
                  <div>
                    <div className="text-lg font-bold tracking-wider text-space-textPrimary flex items-center gap-2">
                      <span>VIGIL</span>
                      <span className="text-[10px] font-mono px-1.5 py-0.2 rounded bg-space-elevated border border-space-cyan/30 text-space-cyan">v2.6</span>
                    </div>
                    <div className="text-[11px] text-space-cyan font-mono tracking-wider">SHOURYA '26 // VYOM</div>
                  </div>
                </div>
                <div className="mt-3 text-[10px] font-mono text-space-textMuted tracking-wider uppercase bg-space-card/60 px-2.5 py-1.5 rounded border border-space-border/60">
                  Space Situational Awareness
                </div>
              </div>

              {/* Navigation Menu */}
              <nav className="mt-5 space-y-1.5" aria-label="Main Navigation">
                {navItems.map((item) => {
                  const active = currentPage === item.id;
                  const Icon = item.icon;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setCurrentPage(item.id)}
                      className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs tracking-wide font-medium transition-all ${
                        active
                          ? 'bg-space-cyan/15 text-space-cyan border border-space-cyan/30 shadow-[0_0_12px_rgba(56,217,245,0.12)] font-semibold'
                          : 'text-space-textSecondary hover:text-space-textPrimary hover:bg-space-elevated/60'
                      }`}
                    >
                      <div className="flex items-center gap-2.5">
                        <Icon />
                        <span>{item.label}</span>
                      </div>
                      {item.badge !== null && (
                        <span className={`text-[10px] font-mono px-1.5 py-0.5 rounded font-semibold ${
                          item.id === 'alerts' && (stats.critical + stats.elevated) > 0
                            ? 'bg-space-threat/20 text-space-threat border border-space-threat/30'
                            : 'bg-space-elevated text-space-textSecondary border border-space-border'

                          {item.badge}
                        </span>

                  {satellites.map((sat) => {

                      >
                        <div>
                          <div className="flex items-center justify-between pb-2 mb-2 border-b border-space-border/60">

                          <div className="font-bold text-space-textPrimary text-sm">{sat.name}</div>

                          <div className="grid grid-cols-2 gap-2 mt-3 pt-2 border-t border-space-border/50 text-xs">

                              <span className="text-[10px] text-space-textMuted block">ALTITUDE</span>

                            <div>
                              <span className="text-[10px] text-space-textMuted block">VELOCITY</span>

                              <span className="text-[10px] text-space-textMuted block">STATUS</span>

                        <div className="mt-3 pt-2 border-t border-space-border/50 flex items-center justify-between text-[11px]">

                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Inspector Detail Drawer (4 Cols) */}
            <div className="lg:col-span-4 bg-space-card border border-space-border rounded-xl p-5 flex flex-col justify-between">
              <div>
                <div className="pb-3 border-b border-space-border flex items-center justify-between">
                  <span className="text-xs font-semibold text-space-cyan tracking-wider">SELECTED TELEMETRY</span>
                  <span className="text-[10px] text-space-textMuted">ID: {selectedSatellite.id}</span>
                </div>

                <div className="mt-4 space-y-3 text-xs">
                  <div>
                    <div className="text-[10px] text-space-textMuted">ASSET TITLE</div>
                    <div className="text-base font-bold text-space-textPrimary">{selectedSatellite.name}</div>
                    <div className="text-space-cyan text-[11px]">{selectedSatellite.operator}</div>
                  </div>

                  <div className="space-y-2 pt-3 border-t border-space-border/60">
                    <div className="flex justify-between">
                      <span className="text-space-textSecondary">Orbital Regime:</span>
                      <span className="text-space-textPrimary font-semibold">{selectedSatellite.regime}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-space-textSecondary">Mean Altitude:</span>
                      <span className="text-space-cyan font-semibold">{selectedSatellite.altitude.toLocaleString()} km</span>

                    <div className="flex justify-between">
                      <span className="text-space-textSecondary">Orbital Velocity:</span>
                      <span className="text-space-textPrimary">{selectedSatellite.velocity} km/s</span>

                      <span className="text-space-safe font-semibold">{selectedSatellite.status}</span>

                  </div>

                  <div className="p-3 bg-space-elevated rounded-lg border border-space-border/60 mt-4 space-y-1.5">
                    <div className="text-[10px] text-space-textMuted font-semibold uppercase">CONJUNCTION RISK SUMMARY</div>
                    <div className="flex justify-between">
                      <span className="text-space-textSecondary">Target Object:</span>
                      <span className={selectedSatellite.conjunctionTarget !== 'NONE' ? 'text-space-threat font-semibold' : 'text-space-textMuted'}>
                        {selectedSatellite.conjunctionTarget}
                      </span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-space-textSecondary">Miss Distance:</span>
                      <span className="text-space-textPrimary">{selectedSatellite.missDistance.toLocaleString()} m</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-space-textSecondary">Probability (PoC):</span>
                      <span className="text-space-warning font-semibold">{selectedSatellite.poc}</span>
                    </div>
                  </div>
                </div>
              </div>

              <div className="pt-4 border-t border-space-border mt-4 space-y-2">
                <button
                  onClick={onSwitchToOverview}
                  className="w-full py-2 bg-space-elevated hover:bg-space-cyan/20 hover:text-space-cyan text-space-textSecondary rounded-lg text-xs font-semibold border border-space-border transition-colors flex items-center justify-center gap-1.5"
                >
                  <IconCrosshair />
                  <span>VIEW IN RADAR HUD</span>
                </button>

                {selectedSatellite.riskLevel === 'Critical' && (
                  <button
                    onClick={() => onRequestBurn(selectedSatellite.id)}
                    className="w-full py-2 bg-space-threat hover:bg-space-threat/90 text-white rounded-lg text-xs font-semibold uppercase tracking-wider shadow-[0_0_12px_rgba(255,83,107,0.35)] flex items-center justify-center gap-1.5 transition-all"
                  >
                    <IconFlame />
                    <span>SIMULATE EVASIVE BURN</span>
                  </button>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // PAGE 3: CONJUNCTION ALERTS VIEW
    // ==========================================
    function AlertsView({ alertItems, selectedSatellite, onSelectSatellite, onRequestBurn, onSwitchToOverview }) {
      return (
        <div className="space-y-6 font-mono">
          {/* Header Warning Banner */}
          <div className="bg-gradient-to-r from-space-threat/15 via-space-card to-space-card border border-space-threat/40 rounded-xl p-5">
            <div className="flex items-start gap-3.5">
              <div className="p-2.5 bg-space-threat/10 border border-space-threat/30 rounded-lg text-space-threat shrink-0">
                <IconAlertTriangle />
              </div>
              <div className="space-y-1">
                <h2 className="text-sm font-bold text-space-threat tracking-wider uppercase">
                  ACTIVE CONJUNCTION & COLLISION ASSESSMENT FEED
                </h2>
                <p className="text-xs text-space-textSecondary leading-relaxed max-w-3xl">
                  Displaying simulated close-approach conjunctions generated via orbital ephemeris propagation. 
                  Events with miss distances under 500 meters or elevated collision probabilities require tactical avoidance review.
                </p>
              </div>
            </div>
          </div>

          {/* Alerts Feed */}
          <div className="space-y-4">
            {alertItems.length === 0 ? (
              <div className="p-12 text-center bg-space-card border border-space-border rounded-xl space-y-3">
                <div className="w-10 h-10 rounded-full bg-space-safe/10 border border-space-safe/30 text-space-safe flex items-center justify-center mx-auto">
                  <IconShieldCheck />
                </div>
                <div className="text-space-safe font-bold text-sm">ALL CONJUNCTION VECTORS RESOLVED</div>
                <div className="text-space-textMuted text-xs max-w-md mx-auto">
                  No critical or elevated close-approach events detected in active simulation queue. Spacecraft orbits are clear.
                </div>
                <button
                  onClick={onSwitchToOverview}
                  className="mt-3 px-4 py-2 bg-space-cyan/15 hover:bg-space-cyan/25 text-space-cyan rounded-lg text-xs font-semibold border border-space-cyan/30 transition-all"
                >
                  Return to Overview HUD
                </button>
              </div>
            ) : (
              alertItems.map((sat) => {
                const isCritical = sat.riskLevel === 'Critical';
                return (
                  <div
                    key={sat.id}
                    className={`p-5 rounded-xl border transition-all ${
                      isCritical
                        ? 'bg-space-threat/5 border-space-threat/40'
                        : 'bg-space-warning/5 border-space-warning/30'
                    }`}
                  >
                    <div className="flex flex-wrap items-center justify-between pb-3 border-b border-space-border/60 gap-2">
                      <div className="flex items-center gap-2.5">
                        <span className={`w-2 h-2 rounded-full ${isCritical ? 'bg-space-threat animate-ping' : 'bg-space-warning'}`}></span>
                        <span className="font-bold text-space-textPrimary text-sm">
                          CONJUNCTION: {sat.name} ↔ {sat.conjunctionTarget}
                        </span>
                      </div>
                      <RiskBadge level={sat.riskLevel} />
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 my-4 text-xs">
                      <div>
                        <span className="text-[10px] text-space-textMuted block uppercase">MISS DISTANCE</span>
                        <span className={`text-base font-bold ${isCritical ? 'text-space-threat' : 'text-space-warning'}`}>
                          {sat.missDistance.toLocaleString()} m
                        </span>
                      </div>
                      <div>
                        <span className="text-[10px] text-space-textMuted block uppercase">TIME TO CLOSEST APPROACH</span>
                        <span className="text-base font-bold text-space-cyan">{sat.tca}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-space-textMuted block uppercase">PROBABILITY (POC)</span>
                        <span className="text-base font-bold text-space-textPrimary">{sat.poc}</span>
                      </div>
                      <div>
                        <span className="text-[10px] text-space-textMuted block uppercase">MEAN ALTITUDE</span>
                        <span className="text-base font-bold text-space-textSecondary">{sat.altitude.toLocaleString()} km ({sat.regime})</span>
                      </div>
                    </div>

                    <div className="pt-3 border-t border-space-border/60 flex flex-wrap items-center justify-between gap-3 text-xs">
                      <div className="text-[11px] text-space-textSecondary">
                        Threat: <strong className="text-space-threat">{sat.conjunctionTarget}</strong> | Operator: <strong className="text-space-textPrimary">{sat.operator}</strong>
                      </div>

                      <div className="flex items-center gap-2.5">
                        <button
                          onClick={() => {
                            onSelectSatellite(sat);
                            onSwitchToOverview();
                          }}
                          className="px-3.5 py-1.5 bg-space-elevated hover:bg-space-cyan/20 hover:text-space-cyan text-space-textSecondary rounded-lg text-xs border border-space-border transition-colors flex items-center gap-1.5"
                        >
                          <IconCrosshair />
                          <span>Lock in Radar HUD</span>
                        </button>

                        {isCritical && (
                          <button
                            onClick={() => onRequestBurn(sat.id)}
                            className="px-4 py-1.5 bg-space-threat hover:bg-space-threat/90 text-white rounded-lg text-xs font-semibold uppercase shadow-[0_0_12px_rgba(255,83,107,0.35)] flex items-center gap-1.5 transition-all"
                          >
                            <IconFlame />
                            <span>Simulate Evasive Burn</span>
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // ORBITAL RADAR CANVAS (CRISP 2D POLAR SIM)
    // ==========================================
    function RadarCanvas({ satellites, selectedSatellite, onSelectSatellite }) {
      const canvasRef = useRef(null);
      const anglesRef = useRef({});

      // Initialize angles
      useEffect(() => {
        satellites.forEach(s => {
          if (anglesRef.current[s.id] === undefined) {
            anglesRef.current[s.id] = s.angle || Math.random() * Math.PI * 2;
          }
        });
      }, [satellites]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;

        // Subtle random starfield cached coordinates
        const stars = Array.from({ length: 45 }).map(() => ({
          x: Math.random(),
          y: Math.random(),
          alpha: 0.15 + Math.random() * 0.45
        }));

        const render = () => {
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.parentElement.getBoundingClientRect();
          const displayWidth = rect.width;
          const displayHeight = rect.height || 400;

          if (canvas.width !== displayWidth * dpr || canvas.height !== displayHeight * dpr) {
            canvas.width = displayWidth * dpr;
            canvas.height = displayHeight * dpr;
          }

          ctx.save();
          ctx.scale(dpr, dpr);

          const width = displayWidth;
          const height = displayHeight;
          const cx = width / 2;
          const cy = height / 2;
          const maxR = Math.min(width, height) * 0.44;

          // Deep Space Dark Background
          ctx.fillStyle = '#030712';
          ctx.fillRect(0, 0, width, height);

          // Subtle Stars
          stars.forEach(star => {
            ctx.fillStyle = `rgba(237, 244, 255, ${star.alpha})`;
            ctx.fillRect(star.x * width, star.y * height, 1, 1);
          });

          // Polar Crosshair Axes
          ctx.strokeStyle = 'rgba(91, 160, 190, 0.12)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx, 10);
          ctx.lineTo(cx, height - 10);
          ctx.moveTo(10, cy);
          ctx.lineTo(width - 10, cy);
          ctx.stroke();

          // Concentric Orbit Rings (LEO, MEO, GEO)
          const shells = [
            { label: 'LEO (~500 km)', r: maxR * 0.38 },
            { label: 'MEO (~20,000 km)', r: maxR * 0.65 },
            { label: 'GEO (35,786 km)', r: maxR * 0.88 }
          ];

          shells.forEach((shell) => {
            ctx.beginPath();
            ctx.arc(cx, cy, shell.r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(56, 217, 245, 0.16)';
            ctx.setLineDash([4, 6]);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = 'rgba(91, 160, 190, 0.4)';
            ctx.font = '9px monospace';
            ctx.fillText(shell.label, cx + 8, cy - shell.r + 11);
          });

          // Earth Central Body with Atmosphere Glow
          const earthR = maxR * 0.16;

          // Soft Atmospheric outer glow
          const atmosGrad = ctx.createRadialGradient(cx, cy, earthR * 0.9, cx, cy, earthR * 1.35);
          atmosGrad.addColorStop(0, 'rgba(56, 217, 245, 0.25)');
          atmosGrad.addColorStop(1, 'rgba(56, 217, 245, 0)');
          ctx.fillStyle = atmosGrad;
          ctx.beginPath();
          ctx.arc(cx, cy, earthR * 1.35, 0, Math.PI * 2);
          ctx.fill();

          // Earth sphere core
          const earthGrad = ctx.createRadialGradient(cx - earthR * 0.3, cy - earthR * 0.3, earthR * 0.1, cx, cy, earthR);
          earthGrad.addColorStop(0, '#1E4E8C');
          earthGrad.addColorStop(0.7, '#0B2545');
          earthGrad.addColorStop(1, '#051329');

          ctx.beginPath();
          ctx.arc(cx, cy, earthR, 0, Math.PI * 2);
          ctx.fillStyle = earthGrad;
          ctx.fill();

          ctx.strokeStyle = 'rgba(56, 217, 245, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = '#EDF4FF';
          ctx.font = '600 8.5px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('EARTH [0,0]', cx, cy + 3);

          // Animate and render satellites
          satellites.forEach((sat) => {
            anglesRef.current[sat.id] = (anglesRef.current[sat.id] || 0) + sat.speed * 0.4;
            const angle = anglesRef.current[sat.id];
            const r = maxR * sat.radiusRatio;

            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;

            sat.renderedX = x;
            sat.renderedY = y;

            const isSelected = selectedSatellite?.id === sat.id;

            // Halo for Selected or Threat
            if (isSelected || sat.riskLevel === 'Critical') {
              ctx.beginPath();
              ctx.arc(x, y, isSelected ? 12 : 8, 0, Math.PI * 2);
              ctx.fillStyle = sat.riskLevel === 'Critical' ? 'rgba(255, 83, 107, 0.2)' : 'rgba(56, 217, 245, 0.2)';
              ctx.fill();
              ctx.strokeStyle = sat.color;
              ctx.lineWidth = 1;
              ctx.stroke();
            }

            // Central Satellite Node
            ctx.beginPath();
            ctx.arc(x, y, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = sat.color;
            ctx.fill();

            // Label
            ctx.fillStyle = isSelected ? '#FFFFFF' : 'rgba(237, 244, 255, 0.75)';
            ctx.font = isSelected ? '600 10px monospace' : '9px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(sat.name, x + 8, y - 3);
          });

          // Draw Conjunction Corridor vector between Critical satellite & its target
          const crit = satellites.find(s => s.riskLevel === 'Critical' && s.conjunctionTarget !== 'NONE');
          if (crit && crit.renderedX && crit.renderedY) {
            const deb = satellites.find(s => s.name === crit.conjunctionTarget || s.id === crit.conjunctionTarget);
            if (deb && deb.renderedX && deb.renderedY) {
              ctx.beginPath();
              ctx.moveTo(crit.renderedX, crit.renderedY);
              ctx.lineTo(deb.renderedX, deb.renderedY);
              ctx.strokeStyle = '#FF536B';
              ctx.lineWidth = 1.5;
              ctx.setLineDash([3, 3]);
              ctx.stroke();
              ctx.setLineDash([]);

              // Conjunction mid-point annotation
              const midX = (crit.renderedX + deb.renderedX) / 2;
              const midY = (crit.renderedY + deb.renderedY) / 2;
              ctx.fillStyle = '#FF536B';
              ctx.font = '600 8.5px monospace';
              ctx.textAlign = 'center';
              ctx.fillText(`VECTOR: ${crit.missDistance}m`, midX, midY - 6);
            }
          }

          ctx.restore();
          animId = requestAnimationFrame(render);
        };

        render();

        return () => cancelAnimationFrame(animId);
      }, [satellites, selectedSatellite]);

      // Click on canvas to select node
      const handleClick = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        for (const sat of satellites) {
          if (sat.renderedX && sat.renderedY) {
            const dist = Math.hypot(sat.renderedX - clickX, sat.renderedY - clickY);
            if (dist < 18) {
              onSelectSatellite(sat);
              break;
            }
          }
        }
      };

      return (
        <canvas
          ref={canvasRef}
          onClick={handleClick}
          className="w-full h-full cursor-crosshair"
          title="Click any satellite node to lock telemetry"
        />
      );
    }

    // Mount the Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
